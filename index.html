    const nx = a.x + dx, ny = a.y + dy;
    if (isWalkable(nx, ny) && !actorAt(nx, ny)) spots.push([nx, ny]);
  }
  if (!spots.length) return false;
  const [x, y] = pick(spots);
  G.actors.push(makeMonster("spawn", x, y));
  burst(x, y, MONSTERS.spawn.body, 16);
  a.summons++;
  a.cooldown = 4;
  log(`${a.spec.name} reißt einen Riss auf — Schattenbrut tritt hervor.`, "bad");
  return true;
}

/* ════════════════════════════════════════════════════════════ Rundenlauf */
function endTurn() {
  const p = G.player;
  G.turns++;
  tickStatuses(p);
  if (!p.alive) return;

  if (p.abilityCd > 0) p.abilityCd--;

  // Öl brennt weiter, ob du dich bewegst oder ausruhst.
  p.oilTick++;
  if (resting > 0) {
    if (p.oilTick >= OIL_PER_REST) {
      p.oilTick = 0;
      if (p.oil > 0) {
        burnOil(1);
        const healed = healActor(p, 1);
        if (healed) floatText(p.x, p.y, "+1", "rgba(124,180,150,.75)");
      }
    }
  } else {
    if (p.oilTick >= (p.oilSteps || OIL_PER_STEPS)) { p.oilTick = 0; burnOil(1); }
    // Ohne Licht erholst du dich nur halb so schnell.
    const interval = p.oil > 0 ? REGEN_INTERVAL : REGEN_INTERVAL * 2;
    if (G.turns % interval === 0) {
      const healed = healActor(p, 1);
      if (healed) floatText(p.x, p.y, "+1", "rgba(124,180,150,.75)");
    }
  }
  updateFov();

  for (const a of [...G.actors]) {
    if (a.isPlayer || !a.alive) continue;
    actorTurn(a);
    if (a.alive) tickStatuses(a);
    if (!p.alive) return;
  }
  updateFov();
  G.actors = G.actors.filter(a => a.isPlayer || a.alive || a.deathAnim === undefined);

  if (p.xp >= xpNeeded()) setTimeout(showLevelUp, 120);
  saveGame();
}

// Zentrale Schleuse: jede Spieleraktion laeuft hier durch.
function act(fn) {
  if (mode.kind !== "play" || !G.player.alive) return;
  logBreak();
  if (fn()) endTurn();
  refreshUI();
}

/* ═══════════════════════════════════════════════════════════ Protokoll */
let logEl, pendingBreak = false;

function logBreak() { pendingBreak = true; }

function log(text, cls = "") {
  const entries = G.logEntries;
  const last = entries[entries.length - 1];
  if (last && last.text === text && last.cls === cls) last.count++;
  else {
    if (pendingBreak && entries.length) entries.push({ break: true });
    entries.push({ text, cls, count: 1 });
  }
  pendingBreak = false;
  if (entries.length > 260) entries.splice(0, 80);
  renderLog();
}

function renderLog() {
  if (!logEl) return;
  const html = G.logEntries.slice(-70).map(e => {
    if (e.break) return '<p class="turn-break"></p>';
    const count = e.count > 1 ? ` <span class="count">×${e.count}</span>` : "";
    return `<p class="${e.cls}">${escapeHtml(e.text)}${count}</p>`;
  }).join("");
  logEl.innerHTML = html;
  logEl.scrollTop = logEl.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ══════════════════════════════════════════════════════════ Zeichnen */
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");

function setupCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = VIEW_W * TILE * dpr;
  canvas.height = VIEW_H * TILE * dpr;
  canvas.style.aspectRatio = `${VIEW_W * TILE} / ${VIEW_H * TILE}`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
}

// Ein Fackelabfall für alles: Kacheln, Wesen, Beute.
function lightAt(dist) {
  const falloff = Math.max(0, 1 - dist / (fovR + 2.5));
  return .40 + .60 * Math.pow(falloff, .62);
}

function camera() {
  // Etwas über den Kartenrand hinaus, damit der Held auch am Rand mittig bleibt
  // statt in eine Ecke der Tafel zu rutschen.
  const OVER = 5;
  const p = G.player;
  let cx = Math.round(p.ax) - (VIEW_W >> 1);
  let cy = Math.round(p.ay) - (VIEW_H >> 1);
  cx = Math.max(-OVER, Math.min(cx, MAP_W - VIEW_W + OVER));
  cy = Math.max(-OVER, Math.min(cy, MAP_H - VIEW_H + OVER));
  return [cx, cy];
}

function drawFrame(dt) {
  anim.t += dt;
  const [camX, camY] = camera();

  // Kamerawackeln bei Treffern
  let sx = 0, sy = 0;
  if (anim.shake > .2) {
    sx = (rng() - .5) * anim.shake;
    sy = (rng() - .5) * anim.shake;
    anim.shake *= Math.pow(.86, dt * 60);
  } else anim.shake = 0;

  ctx.save();
  ctx.translate(sx, sy);
  drawBedrock(camX, camY);

  const px = G.player.ax, py = G.player.ay;
  const flicker = .93 + Math.sin(anim.t * 7.3) * .035 + Math.sin(anim.t * 17.1) * .025;

  // Lavafelder im Ausschnitt leuchten mit; jedes zweite reicht als Lichtquelle.
  const nearLava = [];
  if (G.hasLava) {
    for (let row = -2; row < VIEW_H + 2; row += 2)
      for (let col = -2; col < VIEW_W + 2; col += 2) {
        const lx = col + camX, ly = row + camY;
        if (!inBounds(lx, ly) || G.map.tiles[idx(lx, ly)] !== LAVA) continue;
        if (!G.map.visible[idx(lx, ly)]) continue;
        nearLava.push({ x: lx, y: ly,
          flicker: .88 + Math.sin(anim.t * 2.3 + lx + ly) * .12 });
      }
  }

  // Nur die Schalen im Blickfeld interessieren - jede flackert eigenständig.
  const nearBraziers = [];
  for (const b of (G.braziers || [])) {
    if (b.x < camX - 6 || b.x > camX + VIEW_W + 6 || b.y < camY - 6 || b.y > camY + VIEW_H + 6) continue;
    if (!G.map.visible[idx(b.x, b.y)]) continue;
    const phase = (b.x * 7 + b.y * 13) % 10;
    const base = .88 + Math.sin(anim.t * 6.1 + phase) * .07 + Math.sin(anim.t * 13.7 + phase) * .05;
    // Wer schon nachgefüllt hat, hat der Schale ihr Öl genommen.
    nearBraziers.push({ x: b.x, y: b.y, flicker: b.used ? base * .55 : base });
  }

  /* --- Kacheln --- */
  for (let row = 0; row < VIEW_H; row++) {
    const my = row + camY;
    if (my < 0 || my >= MAP_H) continue;
    for (let col = 0; col < VIEW_W; col++) {
      const mx = col + camX;
      if (mx < 0 || mx >= MAP_W) continue;
      const i = idx(mx, my);
      const vis = G.map.visible[i], exp = G.map.explored[i];
      if (!vis && !exp) continue;

      const x = col * TILE, y = row * TILE;
      const kind = G.map.tiles[i];

      // Fackelabfall: nah warm und hell, am Rand gedämpft - aber nie unlesbar
      let light = 0;
      if (vis) {
        const dist = Math.hypot(mx - px, my - py);
        const falloff = Math.max(0, 1 - dist / (fovR + 2.5));
        light = (.36 + .64 * Math.pow(falloff, .62)) * flicker;
        // Fackelschalen im Raum werfen eigenes Licht
        for (const b of nearBraziers) {
          const bd = Math.hypot(mx - b.x, my - b.y);
          if (bd < BRAZIER_RANGE)
            light = Math.max(light, (.52 + .48 * (1 - bd / BRAZIER_RANGE)) * b.flicker);
        }
        // Lava taucht ihre Umgebung in Glut
        for (const l of nearLava) {
          const ld = Math.hypot(mx - l.x, my - l.y);
          if (ld < LAVA_RANGE)
            light = Math.max(light, (.55 + .45 * (1 - ld / LAVA_RANGE)) * l.flicker);
        }
        light = Math.min(1, light);
      }

      if (kind === WALL || kind === PILLAR) drawWall(x, y, mx, my, vis, light, kind);
      else if (kind === LAVA) drawLava(x, y, mx, my, vis, light);
      else drawFloor(x, y, mx, my, vis, light, kind);
    }
  }

  /* --- Ritualkreis der Endkammer --- */
  if (G.map.circle) {
    const c = G.map.circle;
    const cxp = (c.cx - camX + .5) * TILE, cyp = (c.cy - camY + .5) * TILE;
    const sichtbar = G.map.visible[idx(c.cx, c.cy)] || G.map.explored[idx(c.cx, c.cy)];
    if (sichtbar) {
      const puls = .5 + Math.sin(anim.t * 1.1) * .5;
      ctx.save();
      ctx.strokeStyle = `rgba(216,80,72,${.20 + puls * .16})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cxp, cyp, c.r * TILE, 0, 6.283); ctx.stroke();
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cxp, cyp, (c.r - 1.2) * TILE, 0, 6.283); ctx.stroke();
      // Zeichen auf dem Kreis
      ctx.fillStyle = `rgba(232,120,96,${.24 + puls * .22})`;
      for (let k = 0; k < 12; k++) {
        const w = (k / 12) * 6.283 + anim.t * .05;
        const rx = cxp + Math.cos(w) * (c.r - .6) * TILE;
        const ry = cyp + Math.sin(w) * (c.r - .6) * TILE;
        ctx.fillRect(rx - 2, ry - 5, 4, 10);
      }
      ctx.restore();
    }
  }

  /* --- Spuren: Blut bleibt liegen, wo etwas gestorben ist --- */
  for (const d of (G.decals || [])) {
    const i = idx(d.x, d.y);
    if (!G.map.explored[i]) continue;
    const vis = G.map.visible[i];
    const x = (d.x - camX) * TILE, y = (d.y - camY) * TILE;
    if (x < -TILE || y < -TILE || x > VIEW_W * TILE || y > VIEW_H * TILE) continue;
    ctx.save();
    ctx.globalAlpha = vis ? .48 : .20;
    ctx.fillStyle = vis ? "#5E1A16" : "#243240";
    for (let k = 0; k < 5; k++) {
      const a1 = hash2(d.seed + k * 3, d.x * 5 + d.y);
      const a2 = hash2(d.x + k * 7, d.seed * 2 + d.y);
      const r = 1.8 + a1 * 4;
      ctx.beginPath();
      ctx.ellipse(x + 5 + a1 * (TILE - 12), y + 6 + a2 * (TILE - 14), r, r * .68, a1 * 3, 0, 6.283);
      ctx.fill();
    }
    ctx.restore();
  }

  /* --- Fackelschalen --- */
  for (const b of (G.braziers || [])) {
    const i = idx(b.x, b.y);
    if (!G.map.explored[i]) continue;
    const x = (b.x - camX) * TILE, y = (b.y - camY) * TILE;
    if (x < -TILE || y < -TILE || x > VIEW_W * TILE || y > VIEW_H * TILE) continue;
    drawBrazier(x, y, !!G.map.visible[i], anim.t + (b.x * 7 + b.y * 13) % 10, !!b.used);
  }

  /* --- Gegenstände --- */
  for (const it of G.ground) {
    if (!G.map.visible[idx(it.x, it.y)]) continue;
    const x = (it.x - camX) * TILE, y = (it.y - camY) * TILE;
    if (x < -TILE || y < -TILE || x > VIEW_W * TILE || y > VIEW_H * TILE) continue;
    drawItem(ctx, x, y, it.def, lightAt(Math.hypot(it.x - px, it.y - py)), anim.t);
  }

  /* --- Treppe hervorheben --- */
  if (G.map.stairs) {
    const [tx, ty] = G.map.stairs;
    if (G.map.explored[idx(tx, ty)]) {
      const x = (tx - camX) * TILE, y = (ty - camY) * TILE;
      const pulse = .5 + Math.sin(anim.t * 2.4) * .5;
      ctx.save();
      ctx.globalAlpha = (G.map.visible[idx(tx, ty)] ? .5 : .25) * (.55 + pulse * .45);
      ctx.strokeStyle = C.torch;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x + 4.5, y + 4.5, TILE - 9, TILE - 9);
      ctx.restore();
    }
  }

  /* --- Wesen --- */
  const drawables = G.actors.filter(a => a.alive);
  drawables.sort((a, b) => a.ay - b.ay);
  for (const a of drawables) {
    if (!G.map.visible[idx(a.x, a.y)] && !a.isPlayer) continue;

    // Bewegung weich nachziehen
    const speed = 14 * dt;
    a.ax += (a.x - a.ax) * Math.min(1, speed);
    a.ay += (a.y - a.ay) * Math.min(1, speed);
    if (Math.abs(a.ax - a.x) < .01) a.ax = a.x;
    if (Math.abs(a.ay - a.y) < .01) a.ay = a.y;

    let ox = 0, oy = 0;
    if (a.lunge) {
      a.lunge.life -= dt * 6;
      if (a.lunge.life <= 0) a.lunge = null;
      else {
        const k = Math.sin(a.lunge.life * Math.PI) * .34;
        ox = a.lunge.dx * k * TILE;
        oy = a.lunge.dy * k * TILE;
      }
    }
    if (a.flash > 0) a.flash = Math.max(0, a.flash - dt * 4.5);

    const x = (a.ax - camX) * TILE + ox, y = (a.ay - camY) * TILE + oy;
    if (x < -TILE * 2 || y < -TILE * 2) continue;

    const light = a.isPlayer ? 1 : lightAt(Math.hypot(a.ax - px, a.ay - py));

    if (a.isPlayer) drawHero(ctx, x, y, light, anim.t, a);
    else drawCreature(ctx, x, y, a.spec, light, anim.t + a.bob, a);
  }

  /* --- Fackelschein als Farbschicht --- */
  const lx = (px - camX + .5) * TILE, ly = (py - camY + .5) * TILE;
  const gc = theme().glow;
  const glow = ctx.createRadialGradient(lx, ly, TILE * .5, lx, ly, TILE * (fovR + 1.5));
  glow.addColorStop(0, `rgba(${gc},${.16 * flicker})`);
  glow.addColorStop(.45, `rgba(${gc},${.07 * flicker})`);
  glow.addColorStop(1, `rgba(${gc},0)`);
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, VIEW_W * TILE, VIEW_H * TILE);

  /* --- Staub, der im Fackelschein treibt --- */
  drawMotes(dt, camX, camY, px, py);

  /* --- Lebensleiste für namentliche Gegner --- */
  drawEliteBar();

  /* --- Zielmarkierung --- */
  if (mode.kind === "target") drawTargeting(camX, camY);

  /* --- Effekte --- */
  drawEffects(dt, camX, camY);

  /* --- Vignette --- */
  const vign = ctx.createRadialGradient(
    VIEW_W * TILE / 2, VIEW_H * TILE / 2, VIEW_H * TILE * .34,
    VIEW_W * TILE / 2, VIEW_H * TILE / 2, VIEW_W * TILE * .72);
  vign.addColorStop(0, "rgba(0,0,0,0)");
  vign.addColorStop(1, "rgba(0,0,0,.55)");
  ctx.fillStyle = vign;
  ctx.fillRect(0, 0, VIEW_W * TILE, VIEW_H * TILE);

  ctx.restore();
}

/* Der Fels, aus dem alles herausgeschlagen ist. Wird zwischengespeichert und
   nur neu gezeichnet, wenn sich Ausschnitt oder Tiefe ändern. */
let bedrock = null, bedrockKey = "";
function drawBedrock(camX, camY) {
  const T = theme();
  const key = `${camX},${camY},${T.name}`;
  if (bedrockKey !== key) {
    if (!bedrock) {
      bedrock = document.createElement("canvas");
      bedrock.width = VIEW_W * TILE;
      bedrock.height = VIEW_H * TILE;
    }
    const bc = bedrock.getContext("2d");
    bc.fillStyle = T.rock || "#100D0A";
    bc.fillRect(0, 0, bedrock.width, bedrock.height);
    // Feine Mineralsprenkel statt weicher Flecken - das liest sich als Fels.
    for (let row = -1; row <= VIEW_H; row++) {
      for (let col = -1; col <= VIEW_W; col++) {
        const mx = col + camX, my = row + camY;
        for (let k = 0; k < 3; k++) {
          const a = hash2(mx * 17 + k * 131 + 5, my * 23 + k * 57 + 11);
          if (a < .55) continue;
          const b = hash2(my * 41 + k * 13, mx * 29 + k * 7);
          bc.fillStyle = `rgba(236,224,206,${.010 + (a - .55) * .028})`;
          const w = 1 + a * 2.6, h = 1 + b * 1.6;
          bc.fillRect(col * TILE + b * (TILE - w), row * TILE + a * (TILE - h), w, h);
        }
        // Vereinzelt ein dunkler Riss im Gestein
        const c = hash2(mx * 71 + 3, my * 89 + 19);
        if (c > .93) {
          bc.strokeStyle = "rgba(0,0,0,.35)";
          bc.lineWidth = 1;
          bc.beginPath();
          bc.moveTo(col * TILE, row * TILE + c * TILE);
          bc.lineTo(col * TILE + TILE, row * TILE + (1 - c) * TILE);
          bc.stroke();
        }
      }
    }
    bedrockKey = key;
  }
  ctx.drawImage(bedrock, 0, 0);
}

function mix(a, b, t) {
  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  return `rgb(${Math.round(pa[0] + (pb[0] - pa[0]) * t)},${Math.round(pa[1] + (pb[1] - pa[1]) * t)},${Math.round(pa[2] + (pb[2] - pa[2]) * t)})`;
}

function drawWall(x, y, mx, my, vis, light, kind) {
  const T = theme();
  if (kind === PILLAR) { drawPillar(x, y, mx, my, vis, light, T); return; }

  const openBelow = !isSolid(mx, my + 1);
  const openAbove = !isSolid(mx, my - 1);
  const n = hash2(mx, my);
  const FACE = Math.round(TILE * .34);   // sichtbare Vorderseite der Wand

  if (!vis) {
    ctx.fillStyle = C.memWall;
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = "rgba(0,0,0,.22)";
    ctx.fillRect(x, y + (TILE * .5 | 0), TILE, 1);
    if (openBelow) {
      ctx.fillStyle = "rgba(0,0,0,.30)";
      ctx.fillRect(x, y + TILE - FACE, TILE, FACE);
    }
    if (openAbove) {
      ctx.fillStyle = C.memTop;
      ctx.fillRect(x, y, TILE, 3);
    }
    return;
  }

  // Deckfläche des Mauerwerks
  const topH = openBelow ? TILE - FACE : TILE;
  ctx.fillStyle = mix(T.wallDim, T.wallLit, light);
  ctx.fillRect(x, y, TILE, topH);

  // Oberfläche je nach Bauart: Quader, gewachsener Fels oder Eisenbeschlag
  const mid = y + ((topH * .5) | 0);
  if (T.style === "cave") {
    // Kein Raster - unregelmäßige Buckel und Schatten
    for (let k = 0; k < 5; k++) {
      const a = hash2(mx * 31 + k * 17, my * 13 + k * 43);
      const b = hash2(my * 7 + k * 29, mx * 11 + k * 5);
      ctx.fillStyle = a > .5
        ? `rgba(255,246,230,${.020 + a * .035 * light})`
        : `rgba(0,0,0,${.06 + a * .12})`;
      const rx = TILE * (.14 + a * .22), ry = rx * (.6 + b * .5);
      ctx.beginPath();
      ctx.ellipse(x + b * TILE, y + a * topH, rx, ry, a * 3, 0, 6.283);
      ctx.fill();
    }
  } else if (T.style === "iron") {
    ctx.fillStyle = `rgba(0,0,0,${.16 + n * .10})`;
    ctx.fillRect(x, mid, TILE, 1);
    ctx.fillRect(x + (TILE * (n > .5 ? .5 : .34) | 0), y, 1, mid - y);
    // Eisenband mit Nieten quer über das Mauerwerk
    if (topH > TILE * .5) {
      const by = y + ((topH * .62) | 0);
      ctx.fillStyle = mix("#1A1512", "#6E5A4A", .3 + light * .5);
      ctx.fillRect(x, by, TILE, 5);
      ctx.fillStyle = `rgba(255,214,160,${.16 * light})`;
      ctx.fillRect(x, by, TILE, 1);
      ctx.fillStyle = mix("#0E0A08", "#9A8064", .3 + light * .6);
      for (const px of [.24, .72]) {
        ctx.beginPath();
        ctx.arc(x + TILE * px, by + 2.5, 1.6, 0, 6.283);
        ctx.fill();
      }
    }
  } else {
    ctx.fillStyle = `rgba(0,0,0,${.16 + n * .12})`;
    ctx.fillRect(x, mid, TILE, 1);
    ctx.fillRect(x + (TILE * (n > .5 ? .5 : .34) | 0), y, 1, mid - y);
    ctx.fillRect(x + (TILE * (n > .5 ? .28 : .64) | 0), mid, 1, y + topH - mid);
  }

  // Beleuchtete Oberkante: lässt die Wand aufragen
  if (openAbove) {
    ctx.fillStyle = mix(T.wallDim, T.wallTop, Math.min(1, light + .15));
    ctx.fillRect(x, y, TILE, 4);
    ctx.fillStyle = `rgba(255,220,170,${.10 * light})`;
    ctx.fillRect(x, y, TILE, 1);
  }

  // Vorderseite: das, was dich anschaut, wenn der Raum darunter liegt
  if (openBelow) {
    const fy = y + topH;
    const grad = ctx.createLinearGradient(0, fy, 0, fy + FACE);
    grad.addColorStop(0, mix(T.wallDim, T.wallTop, Math.min(1, light * .9 + .1)));
    grad.addColorStop(1, mix("#0B0908", T.wallDim, .35 + light * .5));
    ctx.fillStyle = grad;
    ctx.fillRect(x, fy, TILE, FACE);
    // Senkrechte Fugen in der Front
    ctx.fillStyle = `rgba(0,0,0,${.22 + n * .1})`;
    ctx.fillRect(x + (TILE * (n > .5 ? .42 : .58) | 0), fy, 1, FACE);
    ctx.fillStyle = `rgba(255,226,180,${.09 * light})`;
    ctx.fillRect(x, fy, TILE, 1);
    // Schlagschatten auf den Boden davor
    ctx.fillStyle = `rgba(0,0,0,${.30 + (1 - light) * .2})`;
    ctx.fillRect(x, fy + FACE - 3, TILE, 3);
  }
}

function drawPillar(x, y, mx, my, vis, light, T) {
  const cx = x + TILE / 2, cy = y + TILE / 2;
  const r = TILE * .30;

  // Boden unter der Säule, damit sie nicht im Nichts steht
  ctx.fillStyle = vis ? mix(T.floorDim, T.floorLit, light * .8) : C.memFloor;
  ctx.fillRect(x, y, TILE, TILE);

  if (!vis) {
    ctx.strokeStyle = C.memTop;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.stroke();
    return;
  }

  // Schatten auf den Boden
  ctx.fillStyle = `rgba(0,0,0,${.34 * light})`;
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * .7, r * 1.05, r * .42, 0, 0, 6.283);
  ctx.fill();

  // Schaft mit Rundung: links hell, rechts im Schatten
  const grad = ctx.createLinearGradient(cx - r, 0, cx + r, 0);
  grad.addColorStop(0, mix(T.wallDim, T.wallTop, Math.min(1, light + .1)));
  grad.addColorStop(.45, mix(T.wallDim, T.wallLit, light));
  grad.addColorStop(1, mix("#0B0908", T.wallDim, .4 + light * .4));
  ctx.fillStyle = grad;
  roundRect(ctx, cx - r, y + 3, r * 2, TILE - 8, r * .35);
  ctx.fill();

  // Kapitell und Sockel
  ctx.fillStyle = mix(T.wallDim, T.wallTop, Math.min(1, light + .18));
  ctx.fillRect(cx - r * 1.2, y + 2, r * 2.4, 4);
  ctx.fillStyle = mix(T.wallDim, T.wallLit, light * .8);
  ctx.fillRect(cx - r * 1.15, y + TILE - 8, r * 2.3, 4);
}

function drawFloor(x, y, mx, my, vis, light, kind) {
  const T = theme();
  const inRoom = G.map.room[idx(mx, my)] === 1;

  if (vis) {
    ctx.fillStyle = mix(T.floorDim, T.floorLit, light);
    ctx.fillRect(x, y, TILE, TILE);

    if (inRoom) {
      // Räume sind gepflastert: regelmäßige Platten mit Fugen
      ctx.fillStyle = `rgba(0,0,0,${.20})`;
      ctx.fillRect(x, y, TILE, 1);
      ctx.fillRect(x, y, 1, TILE);
      ctx.fillStyle = `rgba(255,236,204,${.045 * light})`;
      ctx.fillRect(x + 1, y + 1, TILE - 2, 1);
    } else if (T.style === "cave") {
      // Höhlenboden: unebene Erde mit Pfützen, kein Raster, kein Gangdunkel
      for (let k = 0; k < 5; k++) {
        const a = hash2(mx * 9 + k * 53 + 4, my * 17 + k * 23 + 2);
        const b = hash2(my * 29 + k * 7, mx * 3 + k * 19);
        ctx.fillStyle = a > .74
          ? `rgba(${T.speck},${.010 + light * .016})`
          : `rgba(0,0,0,${.06 + a * .14})`;
        const rx = TILE * (.12 + a * .20), ry = rx * (.55 + b * .5);
        ctx.beginPath();
        ctx.ellipse(x + b * TILE, y + a * TILE, rx, ry, a * 3, 0, 6.283);
        ctx.fill();
      }
      // Vereinzelt stehendes Wasser, das das Licht zurückwirft
      const w = hash2(mx * 61 + 7, my * 47 + 13);
      if (w > .90) {
        ctx.fillStyle = `rgba(120,190,200,${.06 + light * .10})`;
        ctx.beginPath();
        ctx.ellipse(x + TILE * .5, y + TILE * .55, TILE * .30, TILE * .18, 0, 0, 6.283);
        ctx.fill();
      }
    } else {
      // Gänge sind ungepflastert: gleichmäßig dunkler, fein gescheckt,
      // ohne Fugenraster - der Unterschied zum Raum soll ruhig bleiben.
      ctx.fillStyle = `rgba(0,0,0,${.13})`;
      ctx.fillRect(x, y, TILE, TILE);
      for (let k = 0; k < 4; k++) {
        const a = hash2(mx * 7 + k * 97 + 1, my * 5 + k * 31 + 3);
        const b = hash2(my * 19 + k * 11, mx * 23 + k * 3);
        if (a < .45) continue;
        ctx.fillStyle = a > .78
          ? `rgba(${T.speck},${.020 + light * .030})`
          : `rgba(0,0,0,${.05 + a * .06})`;
        const w = 3 + a * 6, h = 2 + b * 5;
        ctx.fillRect(x + b * (TILE - w), y + a * (TILE - h), w, h);
      }
    }

    // Sprenkel im Stein
    const n = hash2(mx * 3 + 1, my * 7 + 5);
    if (n > .64) {
      ctx.fillStyle = `rgba(${T.speck},${.03 + light * .07})`;
      const s = 2 + n * 3;
      ctx.fillRect(x + (n * (TILE - s - 6) | 0) + 3, y + (hash2(my, mx) * (TILE - s - 6) | 0) + 3, s, s);
    }
    drawDecor(T, x, y, mx, my, light);
  } else {
    ctx.fillStyle = C.memFloor;
    ctx.fillRect(x, y, TILE, TILE);
    if (inRoom) {
      ctx.fillStyle = "rgba(90,112,140,.14)";
      ctx.fillRect(x, y, TILE, 1);
      ctx.fillRect(x, y, 1, TILE);
    }
  }

  if (kind === DOOR) drawDoorway(x, y, mx, my, vis, light, T);

  if (kind === STAIRS) {
    ctx.fillStyle = vis ? "rgba(0,0,0,.45)" : "rgba(0,0,0,.35)";
    ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
    ctx.fillStyle = vis ? mix("#4A3F2E", C.torch, .3 + light * .6) : C.memTop;
    for (let i = 0; i < 4; i++) {
      const w = TILE - 10 - i * 4;
      ctx.fillRect(x + (TILE - w) / 2, y + 6 + i * 5, w, 3);
    }
  }
}

/* Lava: leuchtet selbst, blockiert den Weg, lässt aber den Blick durch. */
function drawLava(x, y, mx, my, vis, light) {
  if (!vis) {
    ctx.fillStyle = "#2A1A18";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = "rgba(120,70,50,.35)";
    ctx.lineWidth = 1;
    ctx.strokeRect(x + .5, y + .5, TILE - 1, TILE - 1);
    return;
  }
  const puls = .72 + Math.sin(anim.t * 1.7 + mx * .7 + my * 1.1) * .18
                   + Math.sin(anim.t * 4.3 + mx) * .10;

  ctx.fillStyle = "#3A1206";
  ctx.fillRect(x, y, TILE, TILE);

  const grad = ctx.createRadialGradient(
    x + TILE / 2, y + TILE / 2, 1, x + TILE / 2, y + TILE / 2, TILE * .8);
  grad.addColorStop(0, `rgba(255,232,150,${.85 * puls})`);
  grad.addColorStop(.45, `rgba(240,120,40,${.80 * puls})`);
  grad.addColorStop(1, `rgba(150,40,12,${.75})`);
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, TILE, TILE);

  // Erkaltete Schlackeninseln, damit es nicht wie eine Lampe aussieht
  for (let k = 0; k < 3; k++) {
    const a = hash2(mx * 23 + k * 61, my * 19 + k * 7);
    if (a < .45) continue;
    const b = hash2(my * 37 + k * 3, mx * 41 + k * 13);
    ctx.fillStyle = `rgba(40,18,12,${.55 + a * .3})`;
    const w = 3 + a * 7, h = 2 + b * 5;
    ctx.fillRect(x + b * (TILE - w), y + a * (TILE - h), w, h);
  }
}

/* Türrahmen: zwei Pfosten quer zur Durchgangsrichtung und eine Schwelle.
   Das ist der Trick, der aus Gängen und Löchern ein Gebäude macht. */
function drawDoorway(x, y, mx, my, vis, light, T) {
  const waagerecht = isSolid(mx, my - 1) && isSolid(mx, my + 1);
  const post = Math.max(3, Math.round(TILE * .16));
  const stein = vis ? mix(T.wallDim, T.wallTop, Math.min(1, light + .12)) : C.memTop;
  const dunkel = vis ? mix("#0B0908", T.wallDim, .4 + light * .4) : C.memWall;

  ctx.save();
  if (waagerecht) {
    // Durchgang von links nach rechts: Pfosten oben und unten
    ctx.fillStyle = stein;
    ctx.fillRect(x, y, TILE, post);
    ctx.fillRect(x, y + TILE - post, TILE, post);
    ctx.fillStyle = dunkel;
    ctx.fillRect(x, y + post - 1, TILE, 1);
    ctx.fillRect(x, y + TILE - post, TILE, 1);
    // Schwelle im Boden
    ctx.fillStyle = vis ? `rgba(0,0,0,${.22})` : "rgba(0,0,0,.18)";
    ctx.fillRect(x + TILE / 2 - 1, y + post, 2, TILE - post * 2);
  } else {
    ctx.fillStyle = stein;
    ctx.fillRect(x, y, post, TILE);
    ctx.fillRect(x + TILE - post, y, post, TILE);
    ctx.fillStyle = dunkel;
    ctx.fillRect(x + post - 1, y, 1, TILE);
    ctx.fillRect(x + TILE - post, y, 1, TILE);
    ctx.fillStyle = vis ? `rgba(0,0,0,${.22})` : "rgba(0,0,0,.18)";
    ctx.fillRect(x + post, y + TILE / 2 - 1, TILE - post * 2, 2);
  }
  ctx.restore();
}

/* Was auf dem Boden wächst, glüht oder liegt - je nach Tiefe. */
function drawDecor(T, x, y, mx, my, light) {
  if (T.decor === "none") return;
  const n = hash2(mx * 11 + 3, my * 5 + 7);

  if (T.decor === "shroom" && n > .88) {
    // Pilznester leuchten schwach von selbst
    const pulse = .7 + Math.sin(anim.t * 1.6 + mx + my) * .3;
    const cx = x + 6 + hash2(mx, my) * (TILE - 12);
    const cy = y + 8 + hash2(my, mx) * (TILE - 16);
    ctx.save();
    ctx.shadowColor = "#7EE0B0";
    ctx.shadowBlur = 8 * pulse;
    for (let i = 0; i < 3; i++) {
      const h = hash2(mx + i * 3, my + i);
      const px = cx + (h - .5) * 9, py = cy + (hash2(my + i, mx) - .5) * 7;
      const r = 2 + h * 2.6;
      ctx.fillStyle = `rgba(140,240,190,${(.45 + light * .5) * pulse})`;
      ctx.beginPath();
      ctx.ellipse(px, py, r, r * .8, 0, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = `rgba(40,72,60,${.5 * light})`;
      ctx.fillRect(px - .6, py, 1.2, r * 1.4);
    }
    ctx.restore();
  } else if (T.decor === "ember" && n > .74) {
    // Risse im Boden, in denen es noch glüht
    const pulse = .55 + Math.sin(anim.t * 2.4 + mx * 2 + my) * .45;
    ctx.save();
    ctx.strokeStyle = `rgba(255,150,60,${(.50 + light * .5) * pulse})`;
    ctx.shadowColor = "#FF8A28";
    ctx.shadowBlur = 12 * pulse;
    ctx.lineWidth = 1.6 + hash2(mx, my) * 1.6;
    ctx.beginPath();
    const sx = x + 4 + hash2(mx, my) * (TILE - 12);
    const sy = y + 5 + hash2(my, mx) * (TILE - 12);
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + 5 + hash2(mx + 1, my) * 8, sy + 4 + hash2(my + 1, mx) * 7);
    ctx.lineTo(sx + 2 + hash2(mx + 2, my) * 10, sy + 11 + hash2(my + 2, mx) * 6);
    ctx.stroke();
    ctx.restore();
  } else if (T.decor === "ash" && n > .82) {
    // Asche und Knochensplitter
    ctx.save();
    ctx.fillStyle = `rgba(180,150,150,${.06 + light * .10})`;
    for (let i = 0; i < 4; i++) {
      const h = hash2(mx + i * 7, my + i * 3);
      ctx.fillRect(x + 4 + h * (TILE - 10), y + 5 + hash2(my + i, mx + i) * (TILE - 12),
                   1 + h * 2, 1 + h);
    }
    ctx.restore();
  }
}

/* --- Wesen prozedural zeichnen: jede Art hat ihre eigene Silhouette --- */

function shadowBlob(cx, groundY, rx, alpha) {
  ctx.fillStyle = `rgba(0,0,0,${alpha})`;
  ctx.beginPath();
  ctx.ellipse(cx, groundY, rx, rx * .34, 0, 0, 6.283);
  ctx.fill();
}

// Schmale Leuchtschlitze lesen sich bedrohlicher als runde Punkte.
function slitEyes(cx, ey, s, colour, count, spread) {
  ctx.save();
  ctx.shadowColor = colour;
  ctx.shadowBlur = 7;
  ctx.fillStyle = colour;
  const w = s * .10, h = s * .052;
  const put = (x, y, sw, sh) => {
    roundRect(ctx, x - sw / 2, y - sh / 2, sw, sh, sh / 2);
    ctx.fill();
  };
  if (count === 1) put(cx, ey, w * 1.25, h * 1.3);
  else if (count === 3) {
    put(cx - s * spread, ey, w, h);
    put(cx + s * spread, ey, w, h);
    put(cx, ey - s * .17, w * .85, h * .85);
  } else {
    put(cx - s * spread, ey, w, h);
    put(cx + s * spread, ey, w, h);
  }
  ctx.restore();
}

function limb(x1, y1, x2, y2, width, colour) {
  ctx.strokeStyle = colour;
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

const PAINT = {

    }

    ctx.fillStyle = dark;
    ctx.beginPath();
    ctx.ellipse(cx, g - s * .86, s * .21, s * .19, 0, 0, 6.283);
    ctx.fill();
    slitEyes(cx, g - s * .87, s, eye, 3, .10);
  },
};

function drawCreature(ctx, x, y, spec, light, t, actor) {
  const cx = x + TILE / 2;
  const s = TILE * spec.size;
  const float = spec.float ? Math.sin(t * 1.9) * s * .06 - s * .06 : 0;
  const bob = spec.float ? 0 : Math.sin(t * 2.4) * s * .018;
  const g = y + TILE - 2 + float + bob;   // Standlinie des Wesens

  const P = {
    cx, g, s, t,
    body: mix("#100D0A", spec.body, .30 + light * .70),
    dark: mix("#0A0908", spec.dark, .30 + light * .70),
    eye: mix("#4A3A26", spec.eye || "#F2E6C8", .40 + light * .60),
  };

  ctx.save();

  // Namentliche Gegner stehen in einem Kreis aus eigenem Licht
  if (spec.elite || spec.boss) {
    const pulse = .5 + Math.sin(t * 2.1) * .5;
    ctx.save();
    ctx.globalAlpha = .18 + pulse * .12;
    const ring = ctx.createRadialGradient(cx, y + TILE - 4, s * .1, cx, y + TILE - 4, s * .8);
    ring.addColorStop(0, spec.glow || "#E8A94B");
    ring.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = ring;
    ctx.beginPath();
    ctx.ellipse(cx, y + TILE - 4, s * .8, s * .30, 0, 0, 6.283);
    ctx.fill();
    ctx.restore();
  }

  shadowBlob(cx, y + TILE - 2, s * (spec.float ? .24 : .30), .34 * light * (spec.float ? .55 : 1));

  // Dunkler Umriss: sonst verschwimmen dicht stehende Wesen ineinander.
  ctx.save();
  ctx.shadowColor = "rgba(8,6,5,.95)";
  ctx.shadowBlur = 0;
  const paint = PAINT[spec.art] || PAINT.goblin;
  for (const [ox, oy] of [[-1.5, 0], [1.5, 0], [0, -1.5], [0, 1.5]]) {
    ctx.save();
    ctx.translate(ox, oy);
    ctx.globalCompositeOperation = "source-over";
    ctx.filter = "brightness(0)";
    paint(P, spec);
    ctx.restore();
  }
  ctx.restore();

  if (spec.glow) {
    ctx.shadowColor = spec.glow;
    ctx.shadowBlur = 10 + Math.sin(t * 3) * 3;
  }
  paint(P, spec);
  ctx.shadowBlur = 0;

  if (actor && actor.flash > 0) {
    ctx.globalAlpha = actor.flash * .7;
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "#FFE0C0";
    ctx.beginPath();
    ctx.ellipse(cx, g - s * .42, s * .42, s * .48, 0, 0, 6.283);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawHero(ctx, x, y, light, t, actor) {
  const cx = x + TILE / 2;
  const s = TILE * 1.04;
  const g = y + TILE - 2 + Math.sin(t * 2.2) * s * .015;

  ctx.save();
  shadowBlob(cx, y + TILE - 2, s * .30, .38);

  // Beine
  limb(cx - s * .09, g - s * .30, cx - s * .12, g - s * .01, s * .10, "#4A382A");
  limb(cx + s * .09, g - s * .30, cx + s * .12, g - s * .01, s * .10, "#4A382A");

  // Umhang: fällt hinter der Figur bis zum Boden
  ctx.fillStyle = "#7A2E26";
  ctx.beginPath();
  ctx.moveTo(cx, g - s * .78);
  ctx.quadraticCurveTo(cx - s * .40, g - s * .48, cx - s * .30, g - s * .04);
  ctx.lineTo(cx - s * .16, g - s * .10);
  ctx.lineTo(cx, g - s * .04);
  ctx.lineTo(cx + s * .16, g - s * .10);
  ctx.lineTo(cx + s * .30, g - s * .04);
  ctx.quadraticCurveTo(cx + s * .40, g - s * .48, cx, g - s * .78);
  ctx.closePath();
  ctx.fill();

  // Wams
  ctx.fillStyle = "#C9BCA0";
  ctx.beginPath();
  ctx.moveTo(cx - s * .19, g - s * .62);
  ctx.lineTo(cx + s * .19, g - s * .62);
  ctx.lineTo(cx + s * .16, g - s * .26);
  ctx.lineTo(cx - s * .16, g - s * .26);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#8A6E4A";
  ctx.fillRect(cx - s * .17, g - s * .38, s * .34, s * .06);

  // Waffenarm
  const weapon = G.player.equipped["Waffe"];
  limb(cx + s * .17, g - s * .56, cx + s * .30, g - s * .34, s * .10, "#C9BCA0");
  if (weapon) {
    ctx.save();
    if (weapon.def.glow) { ctx.shadowColor = weapon.def.tint; ctx.shadowBlur = 12; }
    limb(cx + s * .30, g - s * .34, cx + s * .42, g - s * .84, s * .075, weapon.def.tint);
    ctx.restore();
    limb(cx + s * .24, g - s * .40, cx + s * .36, g - s * .30, s * .05, "#6B5335");
  }

  // Fackelarm
  limb(cx - s * .17, g - s * .56, cx - s * .32, g - s * .62, s * .10, "#C9BCA0");
  limb(cx - s * .32, g - s * .62, cx - s * .36, g - s * .78, s * .055, "#6B5335");

  // Kapuze und Gesicht im Schatten
  ctx.fillStyle = "#8E3A2E";
  ctx.beginPath();
  ctx.moveTo(cx - s * .21, g - s * .60);
  ctx.quadraticCurveTo(cx, g - s * .98, cx + s * .21, g - s * .60);
  ctx.quadraticCurveTo(cx, g - s * .70, cx - s * .21, g - s * .60);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#33261C";
  ctx.beginPath();
  ctx.ellipse(cx, g - s * .68, s * .125, s * .115, 0, 0, 6.283);
  ctx.fill();
  slitEyes(cx, g - s * .69, s, "#F4E2BC", 2, .06);

  // Die Fackel selbst - Quelle allen Lichts hier unten, und sie zehrt sich auf
  const oilFrac = Math.max(0, Math.min(1, G.player.oil / 55));
  if (oilFrac > 0) {
    const fl = (.78 + Math.sin(t * 11) * .14 + Math.sin(t * 23) * .08) * (.42 + .58 * oilFrac);
    ctx.save();
    ctx.shadowColor = "#E8A94B";
    ctx.shadowBlur = 22 * fl;
    const grad = ctx.createRadialGradient(
      cx - s * .38, g - s * .90, 0, cx - s * .38, g - s * .90, s * .22 * fl);
    grad.addColorStop(0, "#FFF0C4");
    grad.addColorStop(.45, "#E8A94B");
    grad.addColorStop(1, "rgba(200,110,40,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(cx - s * .38, g - s * .90, s * .17 * fl, s * .23 * fl, 0, 0, 6.283);
    ctx.fill();
    ctx.restore();
  } else {
    // Erloschen: nur noch der verkohlte Kopf der Fackel
    ctx.fillStyle = "#2E2620";
    ctx.beginPath();
    ctx.ellipse(cx - s * .38, g - s * .88, s * .07, s * .09, 0, 0, 6.283);
    ctx.fill();
  }

  if (actor && actor.flash > 0) {
    ctx.globalAlpha = actor.flash * .8;
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "#FFC0A8";
    ctx.beginPath();
    ctx.ellipse(cx, g - s * .44, s * .34, s * .46, 0, 0, 6.283);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawBrazier(x, y, vis, t, used) {
  const cx = x + TILE / 2, base = y + TILE - 4;
  const k = TILE / 26;
  ctx.save();

  if (!vis) {
    // Erinnert, aber erloschen: nur die kalte Kontur der Schale
    ctx.strokeStyle = "#3E4E60";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx - 6 * k, base - 10 * k);
    ctx.lineTo(cx + 6 * k, base - 10 * k);
    ctx.lineTo(cx + 4 * k, base - 4 * k);
    ctx.lineTo(cx - 4 * k, base - 4 * k);
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, base - 4 * k); ctx.lineTo(cx, base);
    ctx.stroke();
    ctx.restore();
    return;
  }

  // Ausgeschöpfte Schalen brennen sichtbar niedriger.
  const fl = (.8 + Math.sin(t * 8.3) * .13 + Math.sin(t * 19.7) * .07) * (used ? .5 : 1);

  // Säule und Schale
  ctx.fillStyle = "#3A3229";
  ctx.fillRect(cx - 2.4 * k, base - 8 * k, 4.8 * k, 8 * k);
  ctx.fillStyle = "#57493A";
  ctx.beginPath();
  ctx.moveTo(cx - 7 * k, base - 13 * k);
  ctx.lineTo(cx + 7 * k, base - 13 * k);
  ctx.lineTo(cx + 4.5 * k, base - 7 * k);
  ctx.lineTo(cx - 4.5 * k, base - 7 * k);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#6E5C46";
  ctx.fillRect(cx - 7 * k, base - 13.6 * k, 14 * k, 1.6 * k);

  // Flamme
  ctx.shadowColor = "#E8A94B";
  ctx.shadowBlur = 20 * fl;
  const grad = ctx.createRadialGradient(cx, base - 18 * k, 0, cx, base - 18 * k, 9 * k * fl);
  grad.addColorStop(0, "#FFF3CC");
  grad.addColorStop(.4, "#E8A94B");
  grad.addColorStop(1, "rgba(190,96,32,0)");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(cx - 5 * k * fl, base - 13 * k);
  ctx.quadraticCurveTo(cx - 5.5 * k, base - 21 * k * fl, cx, base - 26 * k * fl);
  ctx.quadraticCurveTo(cx + 5.5 * k, base - 21 * k * fl, cx + 5 * k * fl, base - 13 * k);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawItem(ctx, x, y, def, light, t) {
  const k = TILE / 26;                       // Maßstab, damit alles zur Kachel passt
  const cx = x + TILE / 2, cy = y + TILE / 2 + Math.sin(t * 2 + x) * 1.3;
  const tint = mix("#12100C", def.tint, .34 + light * .66);
  ctx.save();
  ctx.shadowColor = def.tint;
  ctx.shadowBlur = 9 * light;

  // Schimmer auf dem Boden, damit Beute im Halbdunkel auffällt
  ctx.fillStyle = `rgba(0,0,0,${.25 * light})`;
  ctx.beginPath();
  ctx.ellipse(cx, y + TILE - 4, 7 * k, 2.6 * k, 0, 0, 6.283);
  ctx.fill();

  if (def.kind === "potion") {
    ctx.fillStyle = mix("#151208", "#C8B48A", .3 + light * .7);
    roundRect(ctx, cx - 4 * k, cy - 9 * k, 8 * k, 5 * k, 1.5 * k); ctx.fill();
    ctx.fillStyle = tint;
    ctx.beginPath();
    ctx.moveTo(cx - 5 * k, cy - 4 * k);
    ctx.quadraticCurveTo(cx - 8 * k, cy + 8 * k, cx, cy + 8 * k);
    ctx.quadraticCurveTo(cx + 8 * k, cy + 8 * k, cx + 5 * k, cy - 4 * k);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.42)";
    roundRect(ctx, cx - 3.4 * k, cy - 1 * k, 1.8 * k, 5 * k, .9 * k); ctx.fill();
  } else if (def.kind === "scroll") {
    ctx.fillStyle = mix("#171410", "#DCD1B6", .3 + light * .7);
    roundRect(ctx, cx - 7 * k, cy - 8 * k, 14 * k, 16 * k, 2 * k); ctx.fill();
    ctx.fillStyle = mix("#100E0A", "#A8987A", .3 + light * .7);
    ctx.fillRect(cx - 8.5 * k, cy - 9 * k, 17 * k, 3 * k);
    ctx.fillRect(cx - 8.5 * k, cy + 6 * k, 17 * k, 3 * k);
    ctx.strokeStyle = tint;
    ctx.lineWidth = 1.5 * k;
    ctx.beginPath();
    ctx.moveTo(cx - 4 * k, cy - 3 * k); ctx.lineTo(cx + 4 * k, cy - 3 * k);
    ctx.moveTo(cx - 4 * k, cy);         ctx.lineTo(cx + 2 * k, cy);
    ctx.moveTo(cx - 4 * k, cy + 3 * k); ctx.lineTo(cx + 4 * k, cy + 3 * k);
    ctx.stroke();
  } else if (def.kind === "weapon") {
    ctx.strokeStyle = tint;
    ctx.lineWidth = 3 * k; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(cx - 5 * k, cy + 8 * k); ctx.lineTo(cx + 6 * k, cy - 8 * k); ctx.stroke();
    ctx.strokeStyle = mix("#12100C", "#8A6A44", .3 + light * .7);
    ctx.lineWidth = 2.4 * k;
    ctx.beginPath(); ctx.moveTo(cx - 8 * k, cy + 3 * k); ctx.lineTo(cx - 1 * k, cy + 10 * k); ctx.stroke();
  } else if (def.kind === "armor") {
    ctx.fillStyle = tint;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 9 * k);
    ctx.lineTo(cx + 8 * k, cy - 5 * k);
    ctx.quadraticCurveTo(cx + 8 * k, cy + 6 * k, cx, cy + 10 * k);
    ctx.quadraticCurveTo(cx - 8 * k, cy + 6 * k, cx - 8 * k, cy - 5 * k);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.30)";
    ctx.fillRect(cx - 1 * k, cy - 7 * k, 2 * k, 15 * k);
  } else if (def.kind === "oil") {
    // Bauchiger Krug mit Docht - klar von Tränken zu unterscheiden
    ctx.fillStyle = mix("#14110C", "#6E5636", .3 + light * .7);
    ctx.fillRect(cx - 1.2 * k, cy - 11 * k, 2.4 * k, 4 * k);
    ctx.fillStyle = tint;
    ctx.beginPath();
    ctx.moveTo(cx - 4 * k, cy - 7 * k);
    ctx.quadraticCurveTo(cx - 9 * k, cy - 1 * k, cx - 7 * k, cy + 6 * k);
    ctx.quadraticCurveTo(cx, cy + 11 * k, cx + 7 * k, cy + 6 * k);
    ctx.quadraticCurveTo(cx + 9 * k, cy - 1 * k, cx + 4 * k, cy - 7 * k);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.26)";
    ctx.beginPath(); ctx.ellipse(cx, cy + 3 * k, 5 * k, 2.2 * k, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.36)";
    roundRect(ctx, cx - 4.6 * k, cy - 3 * k, 1.8 * k, 5 * k, .9 * k); ctx.fill();
  } else if (def.kind === "relic") {
    // Auftragsgegenstand: pulsierendes Siegel, unübersehbar
    const pulse = .6 + Math.sin(t * 3) * .4;
    ctx.shadowBlur = 16 * pulse;
    ctx.strokeStyle = tint;
    ctx.lineWidth = 2 * k;
    ctx.beginPath(); ctx.arc(cx, cy, 8 * k, 0, 6.283); ctx.stroke();
    ctx.fillStyle = tint;
    ctx.globalAlpha = .55 + pulse * .45;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * 6.283 - 1.57;
      const r = i % 2 ? 2.6 * k : 6 * k;
      const fx = cx + Math.cos(ang) * r, fy = cy + Math.sin(ang) * r;
      i ? ctx.lineTo(fx, fy) : ctx.moveTo(fx, fy);
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  } else {
    ctx.strokeStyle = mix("#12100C", "#A89678", .3 + light * .7);
    ctx.lineWidth = 1.7 * k;
    ctx.beginPath(); ctx.arc(cx, cy - 2 * k, 6.5 * k, Math.PI * .12, Math.PI * .88, true); ctx.stroke();
    ctx.fillStyle = tint;
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx + 5 * k, cy + 5 * k);
    ctx.lineTo(cx, cy + 10 * k); ctx.lineTo(cx - 5 * k, cy + 5 * k);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Feiner Staub, der nur im Lichtkegel sichtbar wird - Atmosphäre, kein Spielinhalt.
function drawMotes(dt, camX, camY, px, py) {
  if (!anim.motes) anim.motes = [];
  while (anim.motes.length < 34) {
    anim.motes.push({
      x: px + (rng() - .5) * fovR * 1.6,
      y: py + (rng() - .5) * fovR * 1.6,
      vx: (rng() - .5) * .12, vy: -.04 - rng() * .10,
      life: .4 + rng() * .6, size: .6 + rng() * 1.4,
    });
  }
  const T = theme();
  // In der Schmelze steigt Glut auf, in der Höhle schweben Sporen träger.
  const rise = T.decor === "ember" ? 2.2 : T.decor === "shroom" ? .5 : 1;
  ctx.save();
  for (let i = anim.motes.length - 1; i >= 0; i--) {
    const m = anim.motes[i];
    m.x += m.vx * dt; m.y += m.vy * dt * rise;
    m.life -= dt * .16;
    const dist = Math.hypot(m.x - px, m.y - py);
    if (m.life <= 0 || dist > fovR) { anim.motes.splice(i, 1); continue; }
    const fade = Math.min(1, m.life * 2) * (1 - dist / fovR);
    ctx.globalAlpha = fade * (T.decor === "ember" ? .5 : .34);
    ctx.fillStyle = T.mote;
    ctx.fillRect((m.x - camX + .5) * TILE, (m.y - camY + .5) * TILE, m.size, m.size);
  }
  ctx.restore();
}

// Kopfleiste für Zwischenbosse und den Namenlosen, solange sie in Sicht sind.
function drawEliteBar() {
  const foe = G.actors.find(a =>
    a.alive && !a.isPlayer && (a.elite || (a.spec && a.spec.boss)) && seesTile(a.x, a.y));
  if (!foe) return;

  const w = Math.min(420, VIEW_W * TILE - 80);
  const x = (VIEW_W * TILE - w) / 2, y = 14;
  ctx.save();
  ctx.fillStyle = "rgba(14,12,10,.82)";
  roundRect(ctx, x - 12, y - 10, w + 24, 44, 3);
  ctx.fill();
  ctx.strokeStyle = foe.spec.glow || "#B03A2E";
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = "#2A2119";
  ctx.fillRect(x, y + 16, w, 9);
  const frac = Math.max(0, foe.hp / foe.maxhp);
  const grad = ctx.createLinearGradient(x, 0, x + w, 0);
  grad.addColorStop(0, "#8E2E22");
  grad.addColorStop(1, foe.spec.glow || "#D9634F");
  ctx.fillStyle = grad;
  ctx.fillRect(x, y + 16, w * frac, 9);
  ctx.strokeStyle = "rgba(232,220,196,.25)";
  ctx.strokeRect(x + .5, y + 16.5, w - 1, 8);

  ctx.textAlign = "center";
  ctx.font = "600 14px 'Spectral', Georgia, serif";
  ctx.fillStyle = "#E8DCC4";
  ctx.fillText(foe.spec.name, x + w / 2, y + 11);
  if (foe.spec.epithet) {
    ctx.textAlign = "right";
    ctx.font = "italic 11px 'Spectral', Georgia, serif";
    ctx.fillStyle = "rgba(162,149,124,.9)";
    ctx.fillText(foe.spec.epithet, x + w, y + 11);
  }
  ctx.restore();
}

function drawTargeting(camX, camY) {
  const [tx, ty] = mode.cursor;
  const x = (tx - camX) * TILE, y = (ty - camY) * TILE;
  const pulse = .55 + Math.sin(anim.t * 6) * .45;

  if (mode.item.def.target === "area") {
    const r = mode.item.def.radius;
    ctx.save();
    ctx.globalAlpha = .16 + pulse * .1;
    ctx.fillStyle = "#E8703A";
    ctx.beginPath();
    ctx.arc(x + TILE / 2, y + TILE / 2, (r + .5) * TILE, 0, 6.283);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = `rgba(232,112,58,${.5 + pulse * .4})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x + TILE / 2, y + TILE / 2, (r + .5) * TILE, 0, 6.283);
    ctx.stroke();
  }

  ctx.strokeStyle = `rgba(232,169,75,${.6 + pulse * .4})`;
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 2, y + 2, TILE - 4, TILE - 4);
  ctx.fillStyle = `rgba(232,169,75,${.10 + pulse * .08})`;
  ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
}

function drawEffects(dt, camX, camY) {
  for (let i = anim.effects.length - 1; i >= 0; i--) {
    const e = anim.effects[i];
    e.life -= dt * (e.type === "text" ? 1.05 : e.type === "bolt" ? 4 : 1.6);
    if (e.life <= 0) { anim.effects.splice(i, 1); continue; }

    if (e.type === "text") {
      const x = (e.x - camX + .5) * TILE;
      const y = (e.y - camY + .5) * TILE - (1 - e.life) * 26;
      ctx.save();
      ctx.globalAlpha = Math.min(1, e.life * 1.6);
      ctx.font = "600 15px 'Spectral', Georgia, serif";
      ctx.textAlign = "center";
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(12,10,8,.85)";
      ctx.strokeText(e.text, x, y);
      ctx.fillStyle = e.color;
      ctx.fillText(e.text, x, y);
      ctx.restore();
    } else if (e.type === "spark") {
      e.x += e.vx * dt * 4;
      e.y += e.vy * dt * 4;
      e.vy += dt * 5;
      ctx.save();
      ctx.globalAlpha = e.life * .9;
      ctx.fillStyle = e.color;
      const x = (e.x - camX + .5) * TILE, y = (e.y - camY + .5) * TILE;
      ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
      ctx.restore();
    } else if (e.type === "bolt") {
      ctx.save();
      ctx.globalAlpha = e.life;
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 2.2;
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      const x1 = (e.x1 - camX + .5) * TILE, y1 = (e.y1 - camY + .5) * TILE;
      const x2 = (e.x2 - camX + .5) * TILE, y2 = (e.y2 - camY + .5) * TILE;
      ctx.moveTo(x1, y1);
      const segs = 5;
      for (let s = 1; s < segs; s++) {
        const k = s / segs;
        ctx.lineTo(x1 + (x2 - x1) * k + (rng() - .5) * 9,
                   y1 + (y2 - y1) * k + (rng() - .5) * 9);
      }
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.restore();
    } else if (e.type === "ring") {
      ctx.save();
      ctx.globalAlpha = e.life * .7;
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc((e.x - camX + .5) * TILE, (e.y - camY + .5) * TILE,
              (1 - e.life) * e.radius * TILE, 0, 6.283);
      ctx.stroke();
      ctx.restore();
    }
  }
}

function refreshUI() {
  if (!G) return;
  const p = G.player;
  $("floorNumeral").textContent = ROMAN[G.floor] || G.floor;
  $("realmName").textContent = theme().name;
  $("levelTag").textContent = "Stufe " + (ROMAN[p.level] || p.level);

  const maxhp = playerMaxHp();
  $("hpFill").style.width = Math.max(0, (p.hp / maxhp) * 100) + "%";
  $("hpText").textContent = `${Math.max(0, p.hp)} / ${maxhp}`;
  $("oilFill").style.width = Math.max(0, (p.oil / oilCap()) * 100) + "%";
  $("oilText").textContent = p.oil > 0 ? `${p.oil} / ${oilCap()} Öl` : "Fackel erloschen";
  $("oilFill").parentElement.classList.toggle("out", p.oil <= 0);

  const need = xpNeeded();
  $("xpFill").style.width = Math.min(100, (p.xp / need) * 100) + "%";
  $("xpText").textContent = `${p.xp} / ${need} Erfahrung`;
  $("statAtk").textContent = playerAtk();
  $("statDef").textContent = playerDef();

  $("slots").innerHTML = ["Waffe", "Rüstung", "Amulett"].map(slot => {
    const e = p.equipped[slot];
    return `<div class="slot-row"><span>${slot}</span>
      <span class="what ${e ? "" : "empty"}">${e ? escapeHtml(e.def.name) : "nichts"}</span></div>`;
  }).join("");

  const ab = ABILITIES[p.ability];
  const cls = CLASSES[p.cls];
  $("clsTag").textContent = cls ? cls.name : "";
  if (ab) {
    const cooling = p.abilityCd > 0;
    $("ability").className = "ability" + (cooling ? " cooling" : "");
    $("ability").innerHTML =
      `<span class="fkey">F</span><span class="aname">${escapeHtml(ab.name)}</span>` +
      `<span class="acd">${cooling ? p.abilityCd + " R" : "bereit"}</span>`;
  }

  const q = G.quest;
  $("questBlock").hidden = !q;
  if (q) {
    const progress = q.type === "slay" ? `${Math.min(q.progress, q.count)} / ${q.count}` : "";
    const reward = rewardText(q);
    $("quest").innerHTML =
      `<div class="quest-title ${q.done ? "done" : ""}">${escapeHtml(q.title)}</div>
       <div class="quest-desc">${escapeHtml(q.done ? "erfüllt" : q.desc)}</div>` +
      (progress && !q.done ? `<div class="quest-count">${progress}</div>` : "") +
      (reward && !q.done ? `<div class="quest-reward">Lohn: ${escapeHtml(reward)}</div>` : "");
  }

  const statusNames = Object.keys(p.statuses);
  $("statusBlock").hidden = statusNames.length === 0;
  $("statuses").innerHTML = statusNames.map(n => {
    const s = p.statuses[n];
    const colour = n === "Gift" ? "var(--madder-lit)" : "var(--verdigris-lit)";
    return `<div class="pip"><span style="color:${colour}">${n} +${s.mag}</span>
      <span class="turns">${s.turns} R</span></div>`;
  }).join("");

  const foes = G.actors
    .filter(a => !a.isPlayer && a.alive && seesTile(a.x, a.y))
    .sort((a, b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y))
    .slice(0, 7);
  $("foes").innerHTML = foes.length
    ? foes.map(a => `<div class="foe"><span style="color:${a.spec.body}">${escapeHtml(a.spec.name)}</span>
        <span class="bar"><i style="width:${Math.max(0, (a.hp / a.maxhp) * 100)}%"></i></span></div>`).join("")
    : '<div class="quiet">nichts Bedrohliches</div>';
}

/* Banner: kurz, laut, und immer nur eines. Mehrere reihen sich auf. */
const bannerQueue = [];
let bannerTimer = null;

function banner(title, sub, kind) {
  bannerQueue.push({ title, sub: sub || "", kind: kind || "" });
  if (!bannerTimer) nextBanner();
}

function nextBanner() {
  const el = $("banner");
  const next = bannerQueue.shift();
  if (!next) { bannerTimer = null; el.hidden = true; return; }
  el.className = "banner " + next.kind;
  $("bannerTitle").textContent = next.title;
  const sub = $("bannerSub");
  sub.textContent = next.sub;
  sub.style.display = next.sub ? "" : "none";
  el.hidden = true;
  void el.offsetWidth;          // Animation neu anstoßen
  el.hidden = false;
  bannerTimer = setTimeout(nextBanner, 2650);
}

function clearBanners() {
  bannerQueue.length = 0;
  if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer = null; }
  $("banner").hidden = true;
}

function setHint(text) {
  const el = $("hint");
  if (!text) { el.hidden = true; return; }
  el.hidden = false;
  el.textContent = text;
}

const LETTERS = "abcdefghijklmnopqrst";

function primaryLabel(entry) {
  const d = entry.def;
  if (d.quest) return "";
  if (!d.slot) return "Benutzen";
  return Object.values(G.player.equipped).includes(entry) ? "Abnehmen" : "Anlegen";
}

// Was der Wechsel brächte - damit niemand im Kopf rechnen muss.
function compareText(entry) {
  const d = entry.def;
  if (!d.slot) return "";
  const cur = G.player.equipped[d.slot];
  if (!cur || cur === entry) return "";
  const parts = [];
  for (const [k, label] of [["atk", "Angriff"], ["def", "Schutz"], ["maxhp", "Leben"]]) {
    const delta = (d[k] || 0) - (cur.def[k] || 0);
    if (!delta) continue;
    const up = delta > 0;
    parts.push(`<b class="${up ? "up" : "down"}">${up ? "▲" : "▼"} ${label} ${up ? "+" : "−"}${Math.abs(delta)}</b>`);
  }
  if (!parts.length) return `<i class="cmp">gleichwertig zu ${escapeHtml(cur.def.name)}</i>`;
  return `<i class="cmp">${parts.join(" ")}</i>`;
}

function showBag(focus) {
  const bag = G.player.bag;

  const rows = bag.length ? bag.map((entry, i) => {
    const d = entry.def;
    const equipped = Object.values(G.player.equipped).includes(entry);
    const note = d.slot ? bonusText(d) : (d.note || "");
    const action = primaryLabel(entry);
    return `<div class="bag-row">
      <button class="choice bag-main ${equipped ? "equipped" : ""}" data-i="${i}"
              ${action ? "" : "disabled"}>
        <span class="key">${LETTERS[i]}</span>
        <span class="bag-name" style="color:${d.tint}">${escapeHtml(d.name)}${
          equipped ? ' <em>angelegt</em>' : ""}</span>
        <span class="note">${escapeHtml(note)}${equipped ? "" : compareText(entry)}</span>
      </button>
      <button class="bag-act" data-i="${i}" data-do="use" ${action ? "" : "disabled"}>${action || "—"}</button>
      <button class="bag-act drop" data-i="${i}" data-do="drop">Wegwerfen</button>
    </div>`;
  }).join("") : '<p class="quiet" style="padding:14px 0">Dein Beutel ist leer.</p>';

  const p = G.player;
  openModal(`<h2>Beutel</h2>
    <p class="sub">${bag.length} von 20 Plätzen · ${p.hp}/${playerMaxHp()} Leben · ${p.oil} Öl.
      Der Beutel bleibt offen — Zielzauber schließen ihn, weil du die Karte brauchst.</p>
    ${rows}
    <div class="foot">Buchstabe benutzt · Umschalt + Buchstabe wirft weg · Esc schließt</div>`,
    (key, ev) => {
      const i = LETTERS.indexOf(key);
      if (i < 0 || i >= bag.length) return false;
      chooseBagItem(bag[i], !!(ev && ev.shiftKey));
      return true;
    });

  overlay.querySelectorAll("[data-i]").forEach(btn => {
    btn.onclick = () => chooseBagItem(bag[+btn.dataset.i], btn.dataset.do === "drop");
  });

  if (focus != null && bag.length) {
    const at = Math.max(0, Math.min(focus, bag.length - 1));
    const btn = overlay.querySelector(`.bag-main[data-i="${at}"]`);
    if (btn) btn.focus();
  }
}

function showQuestLog() {
  const q = G.quest;

         Lohn: ${escapeHtml(rewardText(q))}</p>` : ""}`

const signed = n => (n > 0 ? "+" : "−") + Math.abs(n);

function bonusText(d) {
  const parts = [];
  if (d.atk) parts.push(`Angriff ${signed(d.atk)}`);
  if (d.def) parts.push(`Schutz ${signed(d.def)}`);
  if (d.maxhp) parts.push(`Leben ${signed(d.maxhp)}`);
  return parts.join(", ") || "keine Boni";
}

function chooseBagItem(entry, dropping) {
  const p = G.player;
  const index = p.bag.indexOf(entry);
  const d = entry.def;

  // Nur Zielzauber schließen den Beutel - dafür muss man die Karte sehen.
  if (!dropping && d.target) { closeModal(); beginTargeting(entry); return; }

  if (!dropping && d.quest) {
    log(`${d.name} lässt sich nicht benutzen — wirf ihn weg, wenn du den Platz brauchst.`, "system");
    showBag(index);
    return;
  }

  if (dropping) act(() => dropItem(entry));
  else if (d.slot) act(() => toggleEquip(entry));
  else act(() => useItem(entry, null));

  // Tod oder Stufenaufstieg übernehmen den Bildschirm, sonst bleibt der Beutel offen.
  if (!p.alive || mode.kind !== "play" || p.xp >= xpNeeded()) { closeModal(); return; }
  showBag(index);
}

function applyLevelUp(fn) {
  overlay._noEscape = false;
  closeModal();
  G.player.xp -= xpNeeded();
  G.player.level++;
  fn();
  log(`Aufstieg auf Stufe ${G.player.level}.`, "alert");
  Sfx.spiel("stufe");
  banner(`Stufe ${ROMAN[G.player.level] || G.player.level}`, "Die Tiefe hat dich etwas gelehrt", "good");
  ring(G.player.x, G.player.y, 2, C.torch);
  burst(G.player.x, G.player.y, C.torch, 20);
  refreshUI();
  saveGame();
  if (G.player.xp >= xpNeeded()) setTimeout(showLevelUp, 200);
}

function steigeTiefer() {
  overlay._noEscape = false;
  closeModal();
  G.endless = true;
  mode = { kind: "play" };
  const p = G.player;
  let ziel = G.map.circle ? [G.map.circle.cx, G.map.circle.cy] : [p.x, p.y];
  if (!isWalkable(ziel[0], ziel[1])) ziel = [p.x, p.y];
  G.map.tiles[idx(ziel[0], ziel[1])] = STAIRS;
  G.map.stairs = ziel;
  Sfx.spiel("treppe");
  log("Wo der Namenlose stand, klafft eine Treppe. Sie führt nur nach unten.", "alert");
  banner("Der Schlund", "Ab hier gibt es kein Zurück", "bad");
  updateFov(); refreshUI(); saveGame();
}

/* Das Lager zwischen zwei Abstiegen: hier wird Asche zu Ausdauer. */
function showCamp() {
  const zeilen = Object.entries(UPGRADES).map(([key, u]) => {
    const stufe = stufeVon(key);
    const voll = stufe >= u.max;
    const preis = voll ? 0 : u.kosten(stufe);
    const leistbar = !voll && META.asche >= preis;
    const jetzt = stufe > 0 ? u.text(stufe) : "noch nichts";
    const naechste = voll ? "" : u.text(stufe + 1);
    return `<div class="bag-row">
      <button class="choice bag-main" data-up="${key}" ${leistbar ? "" : "disabled"}>
        <span class="key">${stufe}/${u.max}</span>
        <span class="bag-name">${escapeHtml(u.name)}
          <em style="color:var(--vellum-faint)">${escapeHtml(jetzt)}</em></span>
        <span class="note">${voll ? "voll ausgebaut"
          : `<i class="cmp"><b class="up">▲ ${escapeHtml(naechste)}</b></i>`}</span>
      </button>
      <button class="bag-act" data-up="${key}" ${leistbar ? "" : "disabled"}>
        ${voll ? "—" : preis + " Asche"}</button>
    </div>`;
  }).join("");

  openModal(`<h2>Lager</h2>
    <p class="sub"><b style="color:var(--torch)">${META.asche} Asche</b> ·
      ${META.laeufe} ${META.laeufe === 1 ? "Abstieg" : "Abstiege"}.
      Asche bringt jeder Lauf mit, auch der gescheiterte.</p>
    <div class="grid2" style="margin:-8px 0 16px">
      <div class="line"><span>Tiefste Etage</span><span>${META.beste}</span></div>
      <div class="line"><span>Siege</span><span>${META.siege}</span></div>
      <div class="line"><span>Beste Ausbeute</span><span>${META.bestAsche | 0} Asche</span></div>
      <div class="line"><span>Schnellster Sieg</span><span>${META.schnellster ? META.schnellster + " Runden" : "—"}</span></div>
    </div>
    ${zeilen}
    <button class="choice" id="zurueckBtn" style="margin-top:14px">
      <span class="key">Esc</span><span>Zurück zur Klassenwahl</span><span class="note"></span></button>`,
    key => { if (key === "escape") { showTitle(); return true; } return false; });
  overlay._noEscape = true;
  $("zurueckBtn").onclick = () => showTitle();
  overlay.querySelectorAll("[data-up]").forEach(btn => {
    btn.onclick = () => kaufe(btn.dataset.up);
  });
}

function kaufe(key) {
  const u = UPGRADES[key];
  const stufe = stufeVon(key);
  if (stufe >= u.max) return;
  const preis = u.kosten(stufe);
  if (META.asche < preis) return;
  META.asche -= preis;
  META.stufen[key] = stufe + 1;
  speichereMeta(META);
  Sfx.spiel("kauf");
  showCamp();
}

function showTitle() {
  const saved = hasSave();
  const classRows = Object.entries(CLASSES).map(([id, c]) =>
    `<button class="choice" data-cls="${id}">
       <span class="key">${c.key.toUpperCase()}</span>
       <span><b style="font-weight:600">${c.name}</b> — ${escapeHtml(c.line)}<br>
         <i style="font-size:12px;color:var(--vellum-faint)">${escapeHtml(c.note)} ·
         ${escapeHtml(ABILITIES[c.ability].name)}</i></span>
       <span class="note"></span></button>`).join("");

  openModal(`<div class="titlecard">
      <h2>Der Abstieg</h2>
      <p class="tagline">Zehn Etagen. Eine Fackel. Kein Weg zurück.</p>
      ${classRows}
      <button class="choice" id="contBtn" ${saved ? "" : "disabled"} style="margin-top:10px">
        <span class="key">W</span>
        <span>Weiterspielen</span><span class="note">${saved ? "gespeicherter Abstieg" : "kein Spielstand"}</span></button>
      <button class="choice" id="lagerBtn2">
        <span class="key">L</span><span>Lager</span>
        <span class="note">${META.asche} Asche</span></button>
      <div class="legend">
        <b>Drei Tiefen und eine Kammer:</b> der Kerker, die Pilzhöhle, die Schmelze —
        und ganz unten Der Namenlose. Auf halbem Weg steht jeweils einer mit Namen.<br>
        <b>Der Rat eines Überlebenden:</b> Dein Öl ist deine Uhr. Es brennt beim Gehen und beim Rasten,
        und wie weit du siehst, hängt daran. Deine Fähigkeit liegt auf <b>F</b> und kostet nichts als Zeit.
      </div>
    </div>`, key => {
    const byKey = Object.entries(CLASSES).find(([, c]) => c.key === key);
    if (byKey) { startNewGame(byKey[0]); return true; }
    if (key === "w" && saved) { if (loadGame()) { closeModal(); afterLoad(); } return true; }
    if (key === "l") { showCamp(); return true; }
    return false;
  });
  overlay._noEscape = true;
  $("lagerBtn2").onclick = () => showCamp();
  overlay.querySelectorAll("[data-cls]").forEach(btn => {
    btn.onclick = () => startNewGame(btn.dataset.cls);
  });
  if (saved) $("contBtn").onclick = () => { if (loadGame()) { closeModal(); afterLoad(); } };
}

/* ═══════════════════════════════════════════════════════ Zielauswahl */
function beginTargeting(entry) {
  const p = G.player;
  let best = null, bestDist = Infinity;
  for (const a of G.actors) {
    if (a.isPlayer || !a.alive || !seesTile(a.x, a.y)) continue;
    const d = Math.hypot(a.x - p.x, a.y - p.y);
    if (d < bestDist) { best = a; bestDist = d; }
  }
  mode = { kind: "target", item: entry, cursor: best ? [best.x, best.y] : [p.x, p.y] };
  setHint("Ziel wählen · Pfeile bewegen · Enter oder Klick bestätigt · Esc bricht ab");
}

function confirmTarget() {
  const entry = mode.item, cursor = mode.cursor;
  mode = { kind: "play" };
  setHint(null);
  act(() => useItem(entry, cursor));
}

function cancelTarget() {
  mode = { kind: "play" };
  setHint(null);
}

/* ══════════════════════════════════════════════════════════ Spielstand */
function saveGame() {
  if (!G || !G.player.alive) return;
  // Nach dem Sieg nur weiter sichern, wenn der Lauf im Schlund weitergeht.
  if (G.won && !G.endless) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(serialize()));
  } catch (e) { /* privater Modus o.ä. - dann eben ohne Speichern */ }
}

function hasSave() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
}

function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

function serialize() {
  return {
    v: 5,
    floor: G.floor, deepest: G.deepest, turns: G.turns, seed,
    tiles: Array.from(G.map.tiles),
    room: Array.from(G.map.room),
    explored: Array.from(G.map.explored),
    stairs: G.map.stairs,
    circle: G.map.circle || null,
    quest: G.quest, questLog: G.questLog,
    won: G.won, endless: G.endless, siegRunden: G.siegRunden,
    braziers: G.braziers, decals: G.decals,
    player: {
      x: G.player.x, y: G.player.y, hp: G.player.hp, level: G.player.level, xp: G.player.xp,
      baseAtk: G.player.baseAtk, baseDef: G.player.baseDef, baseMaxHp: G.player.baseMaxHp,
      oil: G.player.oil, oilMax: G.player.oilMax, oilTick: G.player.oilTick,
      revive: G.player.revive,
      cls: G.player.cls, ability: G.player.ability, abilityCd: G.player.abilityCd,
      oilSteps: G.player.oilSteps, fovBonus: G.player.fovBonus,
      scrollPower: G.player.scrollPower, crit: G.player.crit, evade: G.player.evade,
      statuses: G.player.statuses,
      // ax = Affix, q = Name eines Auftragsgegenstands (der hat keine feste Vorlage)
      bag: G.player.bag.map(e => ({ id: e.id, ax: e.ax || null, q: e.def.quest ? e.def.name : null })),
      equipped: Object.fromEntries(Object.entries(G.player.equipped)
        .map(([k, v]) => [k, v ? G.player.bag.indexOf(v) : -1])),
    },
    actors: G.actors.filter(a => !a.isPlayer && a.alive).map(a => ({
      id: a.id, x: a.x, y: a.y, hp: a.hp, confused: a.confused,
      statuses: a.statuses, summons: a.summons, stunned: a.stunned || 0,
      elite: a.eliteFloor || 0, enraged: !!a.enraged, cooldown: a.cooldown || 0,
      seen: !!a.seen, maff: a.maff || null,
    })),
    ground: G.ground.map(i => ({
      id: i.id, x: i.x, y: i.y, ax: i.ax || null, name: i.def.quest ? i.def.name : null,
    })),
    logEntries: G.logEntries.slice(-60),
  };
}

function loadGame() {
  let data;
  try { data = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return false; }
  if (!data || data.v !== 5) return false;
  try {
    seed = data.seed >>> 0;
    G = freshState();
    G.floor = data.floor; G.deepest = data.deepest; G.turns = data.turns;
    G.logEntries = data.logEntries || [];
    G.won = !!data.won;
    G.endless = !!data.endless;
    G.siegRunden = data.siegRunden || 0;
    G.quest = data.quest || null;
    G.questLog = data.questLog || [];
    G.braziers = data.braziers || [];
    G.decals = data.decals || [];
    G.map = newMap();
    G.map.tiles.set(data.tiles);
    if (data.room) G.map.room.set(data.room);
    G.hasLava = G.map.tiles.includes(LAVA);
    G.map.explored.set(data.explored);
    G.map.stairs = data.stairs;
    G.map.circle = data.circle || null;

    const p = G.player;
    Object.assign(p, {
      x: data.player.x, y: data.player.y, ax: data.player.x, ay: data.player.y,
      hp: data.player.hp, level: data.player.level, xp: data.player.xp,
      baseAtk: data.player.baseAtk, baseDef: data.player.baseDef,
      baseMaxHp: data.player.baseMaxHp, statuses: data.player.statuses || {},
      oil: data.player.oil != null ? data.player.oil : OIL_MAX,
      oilMax: data.player.oilMax || OIL_MAX,
      revive: data.player.revive || 0,
      oilTick: data.player.oilTick || 0,
      cls: data.player.cls || "krieger",
      ability: data.player.ability || "bash",
      abilityCd: data.player.abilityCd || 0,
      oilSteps: data.player.oilSteps || 4,
      fovBonus: data.player.fovBonus || 0,
      scrollPower: data.player.scrollPower || 1,
      crit: data.player.crit || 0,
      evade: data.player.evade || 0,
    });
    p.bag = data.player.bag.map(e => e.q
      ? { id: "relic", def: Object.assign({}, RELIC, { name: e.q }) }
      : buildItem(e.id, e.ax));
    p.equipped = { "Waffe": null, "Rüstung": null, "Amulett": null };
    for (const [slot, i] of Object.entries(data.player.equipped))
      if (i >= 0 && p.bag[i]) p.equipped[slot] = p.bag[i];

    G.actors = [p];
    for (const a of data.actors) {
      const m = a.elite ? makeElite(a.elite, a.x, a.y) : makeMonster(a.id, a.x, a.y, a.maff);
      if (!m) continue;
      m.hp = a.hp; m.confused = a.confused || 0;
      m.statuses = a.statuses || {}; m.summons = a.summons || 0;
      m.cooldown = a.cooldown || 0;
      m.stunned = a.stunned || 0;
      m.seen = !!a.seen;
      if (a.elite) m.enraged = !!a.enraged;
      G.actors.push(m);
    }
    G.ground = data.ground.map(i =>
      i.name ? makeRelic(i.name, i.x, i.y) : makeItem(i.id, i.x, i.y, i.ax));
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

function afterLoad() {
  mode = { kind: "play" };
  updateFov();
  renderLog();
  refreshUI();
  log("Du nimmst den Abstieg wieder auf.", "system");
}

/* ══════════════════════════════════════════════════════════ Spielstart */
function freshState() {
  const player = {
    isPlayer: true, x: 0, y: 0, ax: 0, ay: 0,
    hp: 45, baseMaxHp: 45, baseAtk: 3, baseDef: 1,
    level: 1, xp: 0, alive: true,
    oil: OIL_MAX, oilMax: OIL_MAX, oilTick: 0, revive: 0,
    cls: "krieger", ability: "bash", abilityCd: 0,
    oilSteps: 4, fovBonus: 0, scrollPower: 1, crit: 0, evade: 0,
    bag: [], equipped: { "Waffe": null, "Rüstung": null, "Amulett": null },
    statuses: {}, flash: 0,
  };
  return {
    player, actors: [player], ground: [], map: newMap(),
    braziers: [], decals: [], quest: null, questLog: [],
    floor: 0, deepest: 0, turns: 0, won: false, endless: false, siegRunden: 0,
    logEntries: [],
  };
}

function startNewGame(clsId) {
  overlay._noEscape = false;
  closeModal();
  seed = (Math.random() * 2 ** 32) >>> 0;
  G = freshState();
  mode = { kind: "play" };
  anim.effects.length = 0;
  clearBanners();

  const cls = CLASSES[clsId] || CLASSES.krieger;
  const p = G.player;
  Object.assign(p, {
    cls: CLASSES[clsId] ? clsId : "krieger",
    ability: cls.ability, abilityCd: 0,
    baseMaxHp: cls.hp, hp: cls.hp,
    baseAtk: cls.atk, baseDef: cls.def,
    oilSteps: cls.oilSteps, fovBonus: cls.fovBonus, scrollPower: cls.scrollPower,
    crit: cls.crit || 0, evade: cls.evade || 0,
  });

  // Was du dir in früheren Läufen erarbeitet hast, kommt obendrauf.
  p.baseMaxHp += metaBonus("hp") * 5;
  p.baseAtk += metaBonus("atk");
  p.baseDef += metaBonus("def");
  p.oilMax = OIL_MAX + metaBonus("oil") * 15;
  p.oil = p.oilMax;
  p.revive = metaBonus("revive");
  p.hp = p.baseMaxHp;

  G.floor = 1; G.deepest = 1;
  populateFloor(1);

  for (const id of cls.kit) p.bag.push(buildItem(id, null));
  for (let i = 0; i < metaBonus("potion"); i++) p.bag.push(buildItem("potion", null));
  for (const [slot, id] of Object.entries(cls.wear)) {
    const found = p.bag.find(e => e.id === id && !Object.values(p.equipped).includes(e));
    if (found) p.equipped[slot] = found;
  }

  G.logEntries = [];
  log("Die Tür fällt hinter dir zu. Zehn Etagen trennen dich vom Namenlosen.", "alert");
  log(`Du steigst als ${cls.name} hinab. ${ABILITIES[cls.ability].name} liegt auf F.`, "alert");
  log("Drücke ? für die Steuerung.", "system");
  startQuest(1);
  refreshUI();
  saveGame();
}

/* ══════════════════════════════════════════════════════════════ Eingabe */
const MOVES = {
  ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
  w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
  k: [0, -1], j: [0, 1], h: [-1, 0], l: [1, 0],
  y: [-1, -1], u: [1, -1], b: [-1, 1], n: [1, 1],
  1: [-1, 1], 2: [0, 1], 3: [1, 1], 4: [-1, 0], 6: [1, 0], 7: [-1, -1], 8: [0, -1], 9: [1, -1],
};

window.addEventListener("keydown", ev => {
  Sfx.init();
  const key = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;

  if (modalOpen) {
    if (overlay._onKey && overlay._onKey(key === "Enter" ? "enter" : key, ev)) {
      ev.preventDefault(); return;
    }
    if (key === "Escape" && !overlay._noEscape) { closeModal(); ev.preventDefault(); }
    return;
  }

  if (mode.kind === "aim") {
    if (MOVES[key]) {
      const [dx, dy] = MOVES[key];
      mode = { kind: "play" };
      setHint(null);
      act(() => useAbility(dx, dy));
      ev.preventDefault(); return;
    }
    if (key === "Escape" || key === "f") { cancelAim(); ev.preventDefault(); return; }
    return;
  }

  if (mode.kind === "target") {
    if (MOVES[key]) {
      const [dx, dy] = MOVES[key];
      const step = ev.shiftKey ? 5 : 1;
      mode.cursor[0] = Math.max(0, Math.min(MAP_W - 1, mode.cursor[0] + dx * step));
      mode.cursor[1] = Math.max(0, Math.min(MAP_H - 1, mode.cursor[1] + dy * step));
      ev.preventDefault(); return;
    }
    if (key === "Enter") { confirmTarget(); ev.preventDefault(); return; }
    if (key === "Escape") { cancelTarget(); ev.preventDefault(); return; }
    return;
  }

  if (mode.kind !== "play") return;

  travel = null;
  chase = null;
  if (key !== "r") resting = 0;

  if (MOVES[key]) {
    const [dx, dy] = MOVES[key];
    act(() => tryMove(dx, dy));
    ev.preventDefault(); return;
  }

  switch (key) {
    case " ": case ".": case "5":
      act(() => true); ev.preventDefault(); break;
    case "r": {
      if (G.player.hp >= playerMaxHp()) { log("Du bist bereits ausgeruht.", "system"); break; }
      if (G.actors.some(a => !a.isPlayer && a.alive && seesTile(a.x, a.y))) {
        log("Nicht, solange dich etwas ansieht.", "system"); break;
      }
      if (G.player.oil <= 0) {
        log("Ohne Licht findest du keine Ruhe. Such erst Öl.", "system"); break;
      }
      resting = 250;
      log("Du setzt dich ans Feuer deiner Fackel. Jede geheilte Wunde kostet Öl.", "system");
      break;
    }
    case "m": {
      Sfx.setAn(!Sfx.an);
      if (Sfx.an) Sfx.spiel("aufheben");
      log(Sfx.an ? "Ton an." : "Ton aus.", "system");
      refreshUI();
      break;
    }
    case "f": beginAbility(); break;
    case "g": act(() => pickUp()); break;
    case "i": case "e": showBag(); break;
    case "q": showQuestLog(); break;
    case "c": showCharacter(); break;
    case ">": act(() => takeStairs()); break;
    case "?": showHelp(); break;
    case "Escape": showTitle(); break;
  }
});

/* --- Maus --- */
function tileFromEvent(ev) {
  const rect = canvas.getBoundingClientRect();
  const scale = (VIEW_W * TILE) / rect.width;
  const x = (ev.clientX - rect.left) * scale;
  const y = (ev.clientY - rect.top) * scale;
  const [camX, camY] = camera();
  const tx = Math.floor(x / TILE) + camX;
  const ty = Math.floor(y / TILE) + camY;
  return inBounds(tx, ty) ? [tx, ty] : null;
}

canvas.addEventListener("mousemove", ev => {
  const t = tileFromEvent(ev);
  mouseTile = t;
  if (mode.kind === "target" && t) mode.cursor = [t[0], t[1]];
  else if (mode.kind === "play" && t && seesTile(t[0], t[1])) {
    const a = actorAt(t[0], t[1]);
    const items = itemsAt(t[0], t[1]);
    if (a && !a.isPlayer) setHint(`${a.spec.name} — ${a.hp}/${a.maxhp} Leben`);
    else if (items.length) setHint(items.map(i => i.def.name).join(" · "));
    else setHint(null);
  } else if (mode.kind === "play") setHint(null);
});

canvas.addEventListener("mouseleave", () => {
  mouseTile = null;
  if (mode.kind === "play") setHint(null);
});

canvas.addEventListener("click", ev => {
  Sfx.init();
  const t = tileFromEvent(ev);
  if (!t) return;
  if (mode.kind === "target") { mode.cursor = t; confirmTarget(); return; }
  if (mode.kind === "aim") {
    const p0 = G.player;
    const dx = Math.sign(t[0] - p0.x), dy = Math.sign(t[1] - p0.y);
    if (!dx && !dy) { cancelAim(); return; }
    mode = { kind: "play" };
    setHint(null);
    act(() => useAbility(dx, dy));
    return;
  }
  if (mode.kind !== "play") return;

  const p = G.player;
  const [tx, ty] = t;
  const dx = Math.sign(tx - p.x), dy = Math.sign(ty - p.y);
  travel = null; chase = null; resting = 0;

  // Auf einen sichtbaren Gegner geklickt: hinlaufen und zuschlagen
  const foe = actorAt(tx, ty);
  if (foe && !foe.isPlayer && seesTile(tx, ty)) {
    if (Math.max(Math.abs(tx - p.x), Math.abs(ty - p.y)) === 1) act(() => tryMove(dx, dy));
    else chase = foe;
    return;
  }

  // Nachbarfeld: ein Schritt
  if (Math.max(Math.abs(tx - p.x), Math.abs(ty - p.y)) === 1) {
    act(() => tryMove(dx, dy));
    return;
  }

  // Sonst: Weg berechnen und Schritt für Schritt abgehen
  const path = pathTo(tx, ty);
  if (path) travel = path;
});

// Laufen und Rasten laufen über dieselbe Uhr - beides bricht bei Gefahr ab.
setInterval(() => {
  if (mode.kind !== "play" || modalOpen || !G.player.alive) {
    travel = null; resting = 0; chase = null; return;
  }

  // Verfolgung bricht nicht bei Sichtkontakt ab - Angreifen ist ja die Absicht.
  if (chase) {
    if (!chase.alive || !seesTile(chase.x, chase.y)) {
      chase = null;
      refreshUI();
      return;
    }
    const p = G.player;
    if (Math.max(Math.abs(chase.x - p.x), Math.abs(chase.y - p.y)) <= 1) {
      act(() => tryMove(Math.sign(chase.x - p.x), Math.sign(chase.y - p.y)));
      return;
    }
    const path = pathTo(chase.x, chase.y);
    if (!path || !path.length) { chase = null; return; }
    const [nx, ny] = path[0];
    act(() => tryMove(nx - p.x, ny - p.y));
    return;
  }

  const danger = G.actors.some(a => !a.isPlayer && a.alive && seesTile(a.x, a.y));
  if (danger) {
    if (travel || resting) {
      travel = null; resting = 0;
      log("Du hältst inne — du bist nicht allein.", "system");
      refreshUI();
    }
    return;
  }

  if (travel && travel.length) {
    const [nx, ny] = travel.shift();
    act(() => tryMove(nx - G.player.x, ny - G.player.y));
    if (!travel.length) travel = null;
    return;
  }

  if (resting > 0) {
    if (G.player.hp >= playerMaxHp()) {
      resting = 0;
      log("Du bist ausgeruht.", "good");
      refreshUI();
      return;
    }
    if (G.player.oil <= 0) {
      resting = 0;
      log("Die Fackel ist aus — die Rast endet hier.", "bad");
      refreshUI();
      return;
    }
    // Mehrere Runden je Takt, sonst dauert eine Rast quälend lang.
    for (let i = 0; i < 10 && resting > 0; i++) {
      resting--;
      act(() => true);
      if (!G.player.alive || G.player.hp >= playerMaxHp()) break;
    }
    if (resting === 0 && G.player.alive && G.player.hp < playerMaxHp())
      log("Du brichst die Rast ab.", "system");
  }
}, 105);

/* ══════════════════════════════════════════════════════════ Hauptschleife */
let lastTime = performance.now();
let naechstesKnistern = 0, naechstesGrollen = 0;
function loop(now) {
  const dt = Math.min(.05, (now - lastTime) / 1000);
  lastTime = now;
  if (G) {
    drawFrame(dt);
    // Untermalung: die eigene Fackel und, wenn Lava in Sicht ist, ihr Grollen
    if (Sfx.an && mode.kind === "play" && !modalOpen && G.player.alive) {
      if (G.player.oil > 0 && now > naechstesKnistern) {
        Sfx.spiel("knistern");
        naechstesKnistern = now + 1400 + Math.random() * 3200;
      }
      if (G.hasLava && now > naechstesGrollen) {
        const nah = G.map.tiles.some ? false : false;
        let sicht = false;
        for (let dy = -5; dy <= 5 && !sicht; dy++)
          for (let dx = -5; dx <= 5 && !sicht; dx++) {
            const x = G.player.x + dx, y = G.player.y + dy;
            if (inBounds(x, y) && G.map.tiles[idx(x, y)] === LAVA &&
                G.map.visible[idx(x, y)]) sicht = true;
          }
        if (sicht) Sfx.spiel("lava");
        naechstesGrollen = now + 2600 + Math.random() * 2600;
      }
    }
  }
  requestAnimationFrame(loop);
}

/* ══════════════════════════════════════════════════════════════ Start */
META = ladeMeta();
Sfx.ladeEinstellung();
logEl = $("log");
setupCanvas();
window.addEventListener("resize", setupCanvas);
canvas.tabIndex = 0;

G = freshState();
G.floor = 1;
populateFloor(1);
refreshUI();
requestAnimationFrame(loop);
showTitle();
</script>
